<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div class="container-fluid p-4">

    <div class="hero-card">

        <div class="row align-items-center">

            <div class="col-lg-8">

                <h1 th:text="${title}"></h1>

                <p th:text="${description}"></p>

            </div>

            <div class="col-lg-4 text-end">

                <small>Last Updated</small>

                <h4 th:text="${currentTime}"></h4>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-lg-12">

            <div class="table-card">

                <h3>Overview</h3>

                <p th:text="${content}"></p>

            </div>

        </div>

    </div>

</div>

</body>

</html>
