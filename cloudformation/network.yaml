AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Network infrastructure for the DevOps Capstone Project.
  This template creates:
  - VPC
  - Internet Gateway
  - Two Public Subnets
  - Two Private Subnets
  - Public Route Table
  - Default Route
  - Route Table Associations

Parameters:

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC

  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for Public Subnet 1

  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for Public Subnet 2

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for Private Subnet 1

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.4.0/24
    Description: CIDR block for Private Subnet 2

Resources:

  #################################################
  # VPC
  #################################################

  DevOpsVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: DevOps-Capstone-VPC

        - Key: Project
          Value: DevOps-Capstone

        - Key: Environment
          Value: Lab

  #################################################
  # Internet Gateway
  #################################################

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: DevOps-Capstone-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DevOpsVPC
      InternetGatewayId: !Ref InternetGateway

  #################################################
  # Public Subnet 1 (Existing)
  #################################################

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DevOpsVPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: DevOps-Public-Subnet

  #################################################
  # Public Subnet 2
  #################################################

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DevOpsVPC
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true

      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: DevOps-Public-Subnet-2

  #################################################
  # Private Subnet 1
  #################################################

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DevOpsVPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: DevOps-Private-Subnet-1

  #################################################
  # Private Subnet 2
  #################################################

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DevOpsVPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false

      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: DevOps-Private-Subnet-2

  #################################################
  # Public Route Table
  #################################################

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DevOpsVPC

      Tags:
        - Key: Name
          Value: DevOps-Public-RouteTable

  #################################################
  # Default Internet Route
  #################################################

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  #################################################
  # Route Table Associations
  #################################################

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  PublicSubnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

Outputs:

  VpcId:
    Description: VPC ID
    Value: !Ref DevOpsVPC
    Export:
      Name: DevOpsCapstone-VpcId

  PublicSubnetId:
    Description: Public Subnet ID
    Value: !Ref PublicSubnet
    Export:
      Name: DevOpsCapstone-PublicSubnetId

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: DevOpsCapstone-PublicSubnet2Id

  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Value: !Ref PrivateSubnet1
    Export:
      Name: DevOpsCapstone-PrivateSubnet1Id

  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: DevOpsCapstone-PrivateSubnet2Id

  InternetGatewayId:
    Description: Internet Gateway ID
    Value: !Ref InternetGateway

  PublicRouteTableId:
    Description: Public Route Table ID
    Value: !Ref PublicRouteTable
